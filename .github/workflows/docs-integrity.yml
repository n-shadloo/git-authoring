name: Docs integrity

on: [push, pull_request]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check reference links, orphans, fences, and SKILL.md size
        run: |
          python - <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path

          SKILL = Path("SKILL.md")
          REFS = Path("references")
          SIZE_LIMIT = 40960
          LINK = re.compile(r"references/[A-Za-z0-9._-]+\.md")

          errors = []

          reference_files = sorted(REFS.glob("*.md"))
          citing_files = [SKILL] + reference_files

          # 1. Every references/<name>.md path mentioned must exist on disk.
          cited = {}
          for source in citing_files:
              text = source.read_text(encoding="utf-8")
              for target in sorted(set(LINK.findall(text))):
                  cited.setdefault(target, []).append(source.as_posix())
                  if not Path(target).exists():
                      errors.append(
                          f"{source.as_posix()}: links to {target}, which does not exist"
                      )

          # 2. Every reference file must be cited by SKILL.md or another reference file.
          for path in reference_files:
              target = path.as_posix()
              sources = [s for s in cited.get(target, []) if s != target]
              if not sources:
                  errors.append(
                      f"{target}: orphaned, no link to it from SKILL.md or any other reference file"
                  )

          # 3. Code fences must be balanced in every Markdown file.
          for path in sorted(p for p in Path(".").rglob("*.md") if ".git" not in p.parts):
              fences = [
                  n
                  for n, line in enumerate(
                      path.read_text(encoding="utf-8").splitlines(), start=1
                  )
                  if line.startswith("```")
              ]
              if len(fences) % 2:
                  errors.append(
                      f"{path.as_posix()}: {len(fences)} code fence lines, expected an even "
                      f"number (unclosed fence at line {fences[-1]})"
                  )

          # 4. SKILL.md must stay under the context-budget ceiling.
          size = SKILL.stat().st_size
          if size > SIZE_LIMIT:
              errors.append(
                  f"{SKILL.as_posix()}: {size} bytes, exceeds the {SIZE_LIMIT}-byte limit "
                  f"by {size - SIZE_LIMIT}"
              )

          # 5. The self-improvement rule that the twelve skills share is intact.
          SECTION_0_SHA256 = "5e785008851e26e8530d487d011fe6c4260414c24874918a262ca1ca37cf6658"
          SHARED_RULE = (
              "If this skill's text or script caused a mistake, or you had to find a "
              "step yourself, record it at once. Before you claim the task is done, "
              "end the report with `Skill defects:`. Section 0 of "
              "`SELF-IMPROVEMENT.md` gives the rules. If "
              "`~/.skill-improvements/{name}/` exists, do section 3 first."
          )
          with open("SELF-IMPROVEMENT.md", encoding="utf-8") as fh:
              section_0 = fh.read().partition("\n## 0. ")[2].partition("\n## 1. ")[0]
          if hashlib.sha256(section_0.encode("utf-8")).hexdigest() != SECTION_0_SHA256:
              errors.append(
                  "SELF-IMPROVEMENT.md: section 0 differs from the text that the twelve "
                  "skills share. Change it in all twelve, then update the hash here."
              )
          with open("SKILL.md", encoding="utf-8") as fh:
              skill_name = re.search(r"^name:\s*(\S+)", fh.read(), re.M).group(1)
          for entry in ("SKILL.md", "AGENTS.md", "GEMINI.md", f".cursor/rules/{skill_name}.mdc"):
              with open(entry, encoding="utf-8") as fh:
                  entry_text = " ".join(fh.read().split())
              if entry_text.count(SHARED_RULE.format(name=skill_name)) != 1:
                  errors.append(f"{entry}: lacks the self-improvement rule, word for word")

          if errors:
              for error in errors:
                  print(f"FAIL: {error}", file=sys.stderr)
              sys.exit(f"{len(errors)} docs integrity problem(s) found")

          print(
              f"OK: {len(reference_files)} reference files, {len(cited)} links resolve, "
              f"fences balanced, SKILL.md {size}/{SIZE_LIMIT} bytes"
          )
          PY
